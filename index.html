<!--
  KEY AI, low fidelity clickable prototype. Single file, no build, no network.
  VISUAL WARNING: this file's appearance is a placeholder. Dashed avatars, gray boxes, system fonts, text-label icons
  and the absence of gold are NOT the design. Use this file for behavior, layout order, states and copy only.
  Appearance comes from key-design-system.md and key-tokens.json (Manrope, warm monochrome, champagne gold as a mark,
  4px grid, elevation only on floating layers). See KEY-CONTEXT.md section 0 before building any component.
  Structure for handoff:
    DB      : mock database (people, families, channels, messages, events, calendars, asks, activity, pool, context, rules).
    STATE   : UI state (screen, sheet, membership, onboarding progress, filters, call state).
    render(): routes STATE.screen to a screen function (sSignin, sHome, sMission, sInbox, sFamily, sEvents, sYou, ...),
              then appends sheetHTML() (bottom sheets), the call overlay, push banners, and toasts.
    wire()  : attaches handlers by data-* attributes after every render.
    simulate(): plays the other side of every path in order (approval, connector agrees, target replies, meeting, journal, close).
  Conventions: one card component (.move / .card) in three sizes; face = name, one line, one receipt, one action, one x.
  Sheets: .sheet with #grab; drag down dismisses, up expands. Kai: tap composer, hold quick voice, hold + slide up = call.
  Membership: STATE.member false until approved; pending screens render for every tab until then.
  PORTED 25 Sep (see /* ==== PORTED FROM PRODUCTION */ in the script): Messages list, conversation screen for DMs, groups,
  event chat and channels, threads, chat details, message and conversation sheets, new chat, bell notifications.
  Explore: the pool lives behind the header search only. Empty state shows the shape (counts), a name is plain search, a sentence asks Kai.
-->

/* Granular circle visualizer: scatters when you talk, pulses when Kai talks, drifts when idle */
let vizRAF=null, vizT=0;
const VIZ = { n:150, pts:[] };
for (let i=0;i<VIZ.n;i++){ VIZ.pts.push({ a:(i/VIZ.n)*Math.PI*2, r:1, j:Math.random()*Math.PI*2, s:0.6+Math.random()*0.8 }); }
function vizLoop() {
  const c = phone.querySelector("#vizc");
  if (!c) { vizRAF=null; return; }
  const ctx = c.getContext("2d"); const W=c.width, H=c.height, cx=W/2, cy=H/2;
  vizT += 0.016;
  const now = Date.now();
  if (STATE.vizUntil && now>STATE.vizUntil) { STATE.vizMode = STATE.vizMode==="kai" ? "idle" : STATE.vizMode==="user" ? "kai" : "idle"; STATE.vizUntil = STATE.vizMode==="kai" ? now+2200 : 0; const st=phone.querySelector("#vizs"); if(st) st.textContent = STATE.callMuted?"Muted":(STATE.vizMode==="user"?"Listening":STATE.vizMode==="kai"?"Kai is speaking":"Your turn"); }
  ctx.clearRect(0,0,W,H);
  const mode = STATE.vizMode||"idle";
  const base = 74;
  const pulse = mode==="kai" ? 1 + 0.16*Math.abs(Math.sin(vizT*5)) + 0.05*Math.sin(vizT*13) : 1;
  const rot = mode==="user" ? vizT*1.4 : vizT*0.25;
  for (const p of VIZ.pts) {
    let jitter = 0;
    if (mode==="user") jitter = 18*Math.sin(vizT*9*p.s + p.j) + 10*Math.sin(vizT*17 + p.j*3);
    else if (mode==="kai") jitter = 4*Math.sin(vizT*7 + p.j);
    else jitter = 3*Math.sin(vizT*1.5 + p.j);
    const r = base*pulse + jitter;
    const a = p.a + rot + (mode==="user" ? 0.15*Math.sin(vizT*3+p.j) : 0);
    const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
    const size = mode==="user" ? 1.6+1.4*Math.abs(Math.sin(vizT*10+p.j)) : mode==="kai" ? 2.2 : 1.8;
    ctx.beginPath(); ctx.arc(x,y,size,0,Math.PI*2);
    ctx.fillStyle = mode==="kai" ? "rgba(255,255,255,.95)" : mode==="user" ? "rgba(140,220,170,.95)" : "rgba(255,255,255,.55)";
    ctx.fill();
  }
  // soft core
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,base*pulse*0.9);
  g.addColorStop(0, mode==="kai"?"rgba(255,255,255,.14)":mode==="user"?"rgba(140,220,170,.12)":"rgba(255,255,255,.05)"); g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,base*pulse*0.9,0,Math.PI*2); ctx.fill();
  vizRAF = requestAnimationFrame(vizLoop);
}

function askThread(id, text) {

function profileBody(pid, opts) {

function askCard(a) {

function evStatus(e) { const meet=(e.meet||[]).length; if (e.past) return e.met&&e.met.length?`You met ${e.met.map(id=>DB.people[id].name.split(" ")[0]).join(", ")}`:"You went"; if (e.rsvp) return `<b>Going</b>${meet?`. ${meet} to meet`:""}${e.checkedIn?". Checked in":""}`; return `${e.going} going${meet?`. ${meet} to meet`:""}`; }
function evCard(e, size, opts) {
  opts=opts||{}; const f=DB.families.find(x=>x.id===e.family); const when=(e.when||"").split(", ").slice(-1)[0]||e.when||"";

}

function openerSend(key) {

}

/* ---- Browse: the bounded pool. Filters, search, newest first, every item routed through a member. Never the landing. ---- */
function rememberSearch() { const q=(STATE.searchQ||"").trim(); if(!q) return; STATE.recentSearches=[q, ...(STATE.recentSearches||["Rahul","#jobs","someone who can get me into Anthropic"]).filter(x=>x!==q)].slice(0,5); }
function isAskQuery(q) { const w=q.trim().split(/\s+/); return w.length>=4 || /^(who|what|someone|anyone|find|looking|need|help me|can i|is there)\b/i.test(q.trim()); }
function hl(text, q) { if(!q) return text; const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return text; return text.slice(0,i)+"<mark>"+text.slice(i,i+q.length)+"</mark>"+text.slice(i+q.length); }
function searchIndex(scopeFam) {
  const fams = DB.families.filter(f=>!scopeFam||f.id===scopeFam);
  const people = Object.values(DB.people).filter(p=>p.id!=="priya").map(p=>({ kind:"person", id:p.id, title:p.name, sub:`${p.title}, ${p.company}`, fam:(p.families||[])[0]||"", text:`${p.name} ${p.title} ${p.company} ${(p.help||[]).join(" ")}` }));
  const chans = fams.flatMap(f=>(DB.channels[f.id]||[]).map(c=>({ kind:"channel", id:c.id, title:c.name, sub:`${f.name}${c.joined?"":", not joined"}`, fam:f.name, text:`${c.name} ${c.last||""} ${c.desc||""}` })));
  const evs = DB.fevents.filter(e=>!scopeFam||e.family===scopeFam).map(e=>({ kind:"event", id:e.id, title:e.name, sub:`${e.when||e.day}. ${e.going} going`, fam:e.family, text:`${e.name} ${e.where||""} ${e.when||""}` }));
  const roles = (DB.pool||[]).filter(x=>x.kind!=="person"&&!x.hidden).map(x=>({ kind:"role", id:x.id, title:x.title, sub:`${PKIND[x.kind].l} · ${x.org==="Post"||x.org==="Program"?"via "+firstName(DB.people[x.via]):x.org}. ${x.why}`, fam:x.fam, text:`${x.title} ${x.org} ${x.why}` }));
  const msgs = (DB.dms||[]).map(d=>({ kind:"message", id:d.id, title:DB.people[d.with]?DB.people[d.with].name:"", sub:d.last, fam:"", text:`${DB.people[d.with]?DB.people[d.with].name:""} ${d.last}` }));
  const famsR = DB.families.map(f=>({ kind:"family", id:f.id, title:f.name, sub:`${f.members} members`, fam:f.name, text:f.name }));
  return [...people, ...chans, ...evs, ...roles, ...msgs, ...famsR];
}

function fmtText(t) {
  return t.replace(/(https?:\/\/)?([a-z0-9-]+\.)+(com|ai|io|dev)(\/[^\s]*)?/gi, s=>`<span class="lnk">${s}</span>`)
          .replace(/@(channel|[A-Z][a-z]+ [A-Z][a-z]+)/g, (s,n)=>`<span class="mention" ${n!=="channel"&&personByName(n)?`data-profile="${personByName(n).id}"`:''}>@${n}</span>`);
}
function attHTML(att) {
  if (!att || !att.length) return "";
  const media = att.filter(a=>a.t==="img"||a.t==="vid"), files=att.filter(a=>a.t==="file"), links=att.filter(a=>a.t==="link"), audio=att.filter(a=>a.t==="audio");
  let out = "";
  media.forEach(a=>{
    const n=a.n||1, show=Math.min(n,4);
    const tile=(i)=>`<div class="mtile ${a.t==='vid'?'vid':''}" onclick="event.stopPropagation();toast('Opens full-screen preview: swipe between ${n}, thumbnails below, download')">${a.up!=null?`<span class="upl">${a.up}%</span>`:''}${i===3&&n>4?`<span class="plus">+${n-4}</span>`:''}</div>`;
    out += `<div class="mgrid g${show}">${Array.from({length:show},(_,i)=>tile(i)).join("")}</div>`;
  });
  audio.forEach(a=>{ out += `<div class="aud"><span class="pl">▶</span><span class="atr"><i></i></span><span class="xs faint">${a.dur}</span></div>`; });
  files.forEach(a=>{ out += `<div class="filecard" onclick="event.stopPropagation();toast('Downloading ${a.name}')"><div class="fx">${a.ext}</div><div class="m"><div class="fnm">${a.name}</div><div class="xs faint">${a.ext} · ${a.size}</div></div><span class="dl">↓</span></div>`; });
  links.forEach(a=>{ out += `<div class="lcard" onclick="event.stopPropagation();toast('Opens ${a.url}')"><div class="xs faint">${a.site}</div><div class="lt">${a.title}</div><div class="sm">${a.desc}</div><div class="lnk xs">${a.url}</div></div>`; });
  return out;
}
function reactChip(cid, m) {
  const ks = Object.keys(m.react||{}).filter(k=>m.react[k].length); if (!ks.length) return "";
  const tot = ks.reduce((s,k)=>s+m.react[k].length,0);
  return `<div class="rchip" onclick="event.stopPropagation();openSheet('reactors','${cid}|${m.id}')">${ks.slice(0,3).join("")}<b>${tot}</b></div>`;
}
function kaiActs(c, m) {
  if (c.kind!=="channel") return "";
  const i = (DB.messages[c.id]||[]).findIndex(x=>x.text===m.text.split(" @Priya")[0]||x.text===m.text);
  if (m.role && i>=0) return `<div class="kaiact"><div class="chip" data-track="${c.id}:${i}">${DB.missions.some(x=>x.type==="Looking")?"Kai read a role here. Track it":"Kai read a role here. Start a mission for it"}</div><div class="chip" data-profile="${m.role.poster}">Who's ${first(m.from)}?</div></div>`;
  if (m.intent==="help") return `<div class="kaiact"><div class="chip" onclick="toast('Asked 2 members who listed this, privately. You approved it.')">Ask 2 who can answer</div></div>`;
  if (m.intent==="vouch") return `<div class="kaiact"><div class="chip" data-profile="maya">Who's Maya?</div><div class="chip" onclick="toast('Already a path in your Technical cofounder mission')">Already in a mission</div></div>`;
  return "";
}
function bubbleHTML(c, m, firstOfRun, opts={}) {
  const mine = m.from===meId(); const group = c.kind!=="dm";
  const p = P(m.from);
  const hl = STATE.hl===m.id ? " hl" : "";
  const body = m.deleted ? `<div class="del">This message was deleted</div>`
    : `${m.ritual?`<span class="rt">Ritual · ${m.ritual}</span>`:''}${attHTML(m.att)}${m.text?`<div class="bx">${fmtText(m.text)}</div>`:''}<div class="bf">${m.edited?'Edited ':''}${m.time}</div>`;
  const threadN = m.thread ? (m.threadCount||m.thread.length) : 0;
  const bubble = `<div class="bub ${mine?'me':'oth'} ${firstOfRun?'first':''} ${m.react&&Object.keys(m.react).some(k=>m.react[k].length)?'hasr':''} ${threadN&&!opts.inThread?'hast':''}" data-lp="${c.id}|${m.id}|${opts.parent||''}">
      ${group&&!mine&&firstOfRun?`<div class="bn" data-profile="${p.id}">${p.name}</div>`:''}${body}
      ${m.deleted?'':reactChip(c.id,m)}
      ${threadN&&!opts.inThread?`<div class="thchip" onclick="event.stopPropagation();go('thread:${c.id}:${m.id}')">⌗ View ${threadN} ${threadN===1?'reply':'replies'}</div>`:''}
    </div>`;
  const fail = m.failed ? `<div class="failrow" onclick="event.stopPropagation();retrySend('${c.id}','${m.id}')">Not sent. Tap to retry</div>` : "";
  return `<div class="brow ${mine?'me':'oth'}${hl}">${group&&!mine?(firstOfRun?`<div class="bav" data-profile="${p.id}">${p.initials}</div>`:'<div class="bav sp"></div>'):''}<div class="bcol">${bubble}${fail}${opts.inThread?'':kaiActs(c,m)}</div></div>`;
}
function msgsHTML(c, list, opts={}) {
  let out="", prevDay=null, prev=null;
  list.forEach(m=>{
    if (m.day!==prevDay) { out += `<div class="dsep"><span>${m.day}</span></div>`; prevDay=m.day; prev=null; }
    if (m.sys) { out += `<div class="syspill"><span>${m.sys}</span></div>`; return; }
    const firstOfRun = !prev || prev.from!==m.from;
    out += bubbleHTML(c, m, firstOfRun, opts); prev=m;
  });
  return out;
}

/* ---------- composer ---------- */
function composerBar(c, target) {
  const k = target||c.id;
  if (c.blockedByMe) return `<div class="foot cbar"><div class="row" style="gap:8px"><button class="btn sec" style="flex:1;color:var(--danger)" onclick="openSheet('pconfirm','delconv|${c.id}')">Delete</button><button class="btn" style="flex:1" onclick="convOf('${c.id}').blockedByMe=false;render();toast('Unblocked. ${first(c.with)} can message you again.')">Unblock</button></div></div>`;
  if (c.kind==="channel" && c.ch && !c.ch.joined) return `<div class="foot cbar"><div class="xs faint" style="text-align:center;margin-bottom:8px">${c.ch.private?"Private channel. The organizer approves requests.":"You're previewing. Join to post and get notified."}</div><button class="btn" onclick="joinCh('${c.id}')">${c.ch.private?"Ask to join":"Join #"+c.title}</button></div>`;
  if (c.kind==="channel" && c.ch && c.ch.readonly && !STATE.asOrganizer) return `<div class="foot cbar"><div class="xs faint" style="text-align:center">Only organizers post in #${c.title}. React or reply in a thread.</div></div>`;
  const draft = (STATE.drafts||{})[k]||"";
  const pend = (STATE.pending||{})[k]||[];
  const editing = STATE.editMsg && STATE.editMsg.k===k;
  return `<div class="foot cbar">
    ${STATE.fmtOpen&&!editing?`<div class="fmtbar">${["B","I","U","S","&lt;/&gt;","•","1.","❝","🔗"].map(x=>`<span onclick="toast('Formatting: applies to the selection')">${x}</span>`).join("")}</div>`:''}
    ${pend.length?`<div class="pstrip">${pend.map((a,i)=>`<div class="ptile">${a.t==="file"?a.ext:""}<span class="x" onclick="STATE.pending['${k}'].splice(${i},1);render()">×</span></div>`).join("")}</div>`:''}
    <div id="mentionBox"></div>
    <div class="crow ${draft||pend.length?'has':''}" id="crow">
      ${editing?'':`<div class="plus ${STATE.fmtOpen?'on':''}" onclick="STATE.fmtOpen=!STATE.fmtOpen;render()">${STATE.fmtOpen?'×':'+'}</div>`}
      <div class="cpill"><textarea class="ci" id="ci" data-k="${k}" data-c="${c.id}" rows="1" placeholder="Start typing...">${draft}</textarea>${editing?'':`<span class="att" onclick="openSheet('attach','${k}')">⧉</span>`}</div>
      <div class="cmic" onclick="toast('Hold to record a voice note')"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></div>
      <div class="csend" onclick="sendMsg('${c.id}','${k}')">${editing?'✓':'↑'}</div>
    </div></div>`;
}
function joinCh(cid) { const c=convOf(cid); if (c.ch.private) { toast("Requested. The organizer approves private channels."); return; } c.ch.joined=true; c.msgs.push({ id:mid(), sys:`<b>${P(meId()).name}</b> joined.`, day:"Today" }); render(); toast(`Joined #${c.title}.`); }
function findMsg(c, id, parent) { if (parent) { const pm=c.msgs.find(x=>x.id===parent); return pm && pm.thread.find(x=>x.id===id); } return c.msgs.find(x=>x.id===id); }
function sendMsg(cid, k, confirmed) {
  const c = convOf(cid); const ta = phone.querySelector("#ci"); const text = (ta?ta.value:(STATE.drafts||{})[k]||"").trim();
  const pend = (STATE.pending||{})[k]||[];
  if (!text && !pend.length) return;
  if (STATE.editMsg && STATE.editMsg.k===k) { const e=STATE.editMsg; const m=findMsg(c,e.id,e.parent); m.text=text; m.edited=true; STATE.editMsg=null; STATE.drafts[k]=e.prev||""; render(); toast("Edited"); return; }
  const reach = c.kind==="channel" ? c.members : (c.memberIds||[]).length-1;
  if (/@channel/.test(text) && reach>5 && !confirmed) { STATE.drafts=STATE.drafts||{}; STATE.drafts[k]=text; openSheet("chanmention", cid+"|"+k+"|"+reach); return; }
  const m = M(meId(), text, { day:"Today", time:nowTime(), att:pend.slice(), failed:!!STATE.offline });
  const [,thr] = k.split("::");
  if (thr) { const pm=c.msgs.find(x=>x.id===thr); pm.thread=pm.thread||[]; pm.thread.push(m); pm.threadCount=(pm.threadCount||pm.thread.length-1)+1; } else c.msgs.push(m);
  STATE.drafts=STATE.drafts||{}; STATE.drafts[k]=""; if (STATE.pending) STATE.pending[k]=[];
  if (m.att.some(a=>a.t==="img")) { m.att.forEach(a=>{ if(a.t==="img") a.up=38; }); setTimeout(()=>{ m.att.forEach(a=>{ if(a.t==="img") a.up=86; }); render(); },500); setTimeout(()=>{ m.att.forEach(a=>{ delete a.up; }); render(); },1000); }
  STATE.sheet=null; render(); scrollChat();
  if (STATE.offline) toast("Couldn't send. You're offline. Tap the message to retry.");
}
function retrySend(cid, id) { const c=convOf(cid); const m=c.msgs.find(x=>x.id===id); if (STATE.offline) { toast("Still offline. It'll stay here until you retry."); return; } m.failed=false; m.time=nowTime(); render(); toast("Sent"); }
function scrollChat() { const b=phone.querySelector(".chatbody"); if (b) b.scrollTop=b.scrollHeight; }

  if (c.kind==="dm") { const p=P(c.with); const o=DB.opps.find(x=>x.personId===c.with); return `<div class="hdr chdr"><div class="back" onclick="STATE.backNav=true;goBack()">‹</div><div class="hav sq" data-profile="${p.id}">${p.initials}</div><div class="hm" data-profile="${p.id}"><div class="hn">${p.name}</div>${c.path&&o?`<div class="xs faint" data-opp="${o.id}" style="text-decoration:underline">Part of a path · open</div>`:''}</div><div class="icon" onclick="openSheet('conv','${c.id}')">···</div></div>`; }
  if (c.kind==="channel") { const faces=(c.memberIds||[]).slice(0,3).map(id=>`<span>${P(id).initials}</span>`).join(""); return `<div class="hdr chdr"><div class="back" onclick="STATE.backNav=true;go('family')">‹</div><div class="hav emo" onclick="go('chatinfo:${c.id}')">${c.emoji}${c.ch&&c.ch.private?'<i class="lock">🔒</i>':''}</div><div class="hm" onclick="go('chatinfo:${c.id}')"><div class="hn">${c.title}${c.muted?' <span class="xs faint">🔕</span>':''}</div><div class="xs faint">${c.members} members</div></div><div class="hfaces" onclick="STATE.ciTab='members';go('chatinfo:${c.id}')">${faces}<span>+${Math.max(0,c.members-3)}</span></div><div class="icon" onclick="openSheet('conv','${c.id}')">···</div></div>`; }

}

}
function chatsListHTML() {

const VOUCH = {
  c1: { know:["Worked together at Google, 2019 to 2021. 14 messages this year","history"], record:["New to Key. No intros yet, replies within a day","ledger"], size:["20 minutes on a cofounder conversation","her note"], open:["Maya is open to cofounder chats, 2 slots left this month","Maya's rules"] },

const VSTRENGTH = [["strong","I know them well"],["worked","We've worked together"],["light","We've met"]];
function vouchFacts(a) {

const _sReqThread = sReqThread;
sReqThread = function(aid) {
  let h = _sReqThread(aid); const a = DB.asks.find(x=>x.id===aid);
  if (a.kind==="forwarded") {
    const v=DB.people[a.via]; const from=DB.people[a.from];
    return h.replace('<div class="lbl">Why this is a good one</div>', `<div class="ctxcard"><div class="sm"><b>${firstName(v)} vouches:</b> worked with ${firstName(from)} at Google. Strong.</div><div class="xs muted" style="margin-top:4px">${firstName(from)} wrote their own note, with Kai.</div></div><div class="lbl">Why this is a good one</div>`);
  }
  if (a.kind!=="connector" || !(a.state==="open"||a.state==="pending")) return h;
  const from=firstName(DB.people[a.from]), to=firstName(DB.people[a.target]);
  const fi = h.lastIndexOf('<div class="foot">');
  const status = a.checking ? `<div class="msg sys" style="margin:14px auto">Checking with ${to} first, without ${from}'s name</div>` : a.asked ? `<div class="msg sys" style="margin:14px auto">You asked ${from} a question. Waiting on the answer.</div>` : "";
  const foot = `<div class="foot"><div class="row" style="gap:8px"><button class="btn" style="flex:1 1 auto;width:auto;white-space:nowrap" onclick="openSheet('forward','${aid}')">Forward and vouch</button><button class="btn sec" style="flex:0 0 30%;width:auto" data-askno="${aid}">Not now</button></div>
    <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center"><span class="chip" style="font-size:12px" onclick="openSheet('vpass','${aid}')">Pass along, no vouch</span><span class="chip" style="font-size:12px" onclick="openSheet('vcheck','${aid}')">Check with ${to} first</span><span class="chip" style="font-size:12px" onclick="openSheet('vask','${aid}')">Ask ${from} something</span></div>
    <div class="xs faint" style="margin-top:8px;text-align:center">Forwarding uses one of your slots. A no, a check or a question doesn't.</div></div>`;
  return h.slice(0, fi).replace(/<\/div>\s*$/, `${vouchFacts(a)}${status}</div>`) + foot;
};
const _forwardSheet = forwardSheet;

function vouchSheet(type, id) {
  const a = DB.asks.find(x=>x.id===id); const from=firstName(DB.people[a.from]), to=firstName(DB.people[a.target]);
  if (type==="vpass") return `<h2>Pass along without vouching</h2><p class="sm muted">${to} gets ${from}'s note and sees that you passed it on without vouching. It uses one of your slots.</p>${msgComposer({ id:"vpassline", draft:`${to}, passing this along from ${from}. I don't know them well, so your call entirely.`, sendAttr:`onclick="vouchDo('pass','${id}')"`, disclosure:`${to} sees: passed along by Chris, no vouch.` })}`;
  if (type==="vcheck") return `<h2>Check with ${to} first</h2><p class="sm muted">Kai asks ${to} without naming ${from}. If ${to} says no, nobody is told anything. Doesn't use a slot.</p>${msgComposer({ id:"vcheckline", draft:`Quick one: open to a 20-minute cofounder chat with a PM from Google Cloud? No names until you say yes.`, sendAttr:`onclick="vouchDo('check','${id}')"`, disclosure:`${to} sees it's from you. ${from}'s name stays out.` })}`;
  return `<h2>Ask ${from} something</h2><p class="sm muted">The request waits while you ask. Doesn't use a slot.</p>${msgComposer({ id:"vaskline", draft:`Happy to help. What are you hoping to get from ${to}, in a line?`, sendAttr:`onclick="vouchDo('ask','${id}')"`, disclosure:`Goes to ${from} only.` })}`;

function vouchDo(k, id) {

  if (k==="check") { a.checking=true; a.state="pending"; render(); toast(`Asked ${to}, without ${from}'s name.`); return; }
  a.asked=true; render(); toast(`Sent to ${from}.`);
}

const EV_THEMES = { gold:["Gold plate","linear-gradient(135deg,#D9BC6E,#A87F2A)"], ink:["Ink","linear-gradient(135deg,#3B4652,#12161A)"], dusk:["Dusk","linear-gradient(135deg,#8A7A9E,#2E2A3A)"], sage:["Sage","linear-gradient(135deg,#9DB3A3,#40584A)"], harbour:["Harbour","linear-gradient(135deg,#7E9DB5,#27394A)"], photo:["Photo","repeating-linear-gradient(135deg,#9AA3AD 0 10px,#8A939D 10px 20px)"] };
const EV_MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], EV_DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const evBg = t => (EV_THEMES[t]||EV_THEMES.gold)[1];
const evE = id => DB.fevents.find(x=>x.id===id);
const evC = id => DB.calendars.find(x=>x.id===id);
const evFirst = id => (DB.people[id]||{name:"Someone"}).name.split(" ")[0];
const evMyFams = () => DB.families.map(f=>f.id);
const evDate = e => { const m=Math.floor(e.sort/100), d=e.sort%100; return new Date(2026, m-1, d); };
const evDayLabel = e => { const d=evDate(e); return `${EV_DOW[d.getDay()]}, ${EV_MON[d.getMonth()]} ${d.getDate()}`; };
function evIsAdmin(c){ return !!c && (c.admins||[]).includes(EV_ME); }
function evFollows(c){ return !!c && (evIsAdmin(c) || c.subscribed || (c.auto && c.family && evMyFams().includes(c.family) && c.unfollowed!==true)); }
function evMemberOf(c){ return !!c && !!c.family && evMyFams().includes(c.family); }
function evLocked(e){ const c=evC(e.cal); return e.vis==="members" && !!c && !evMemberOf(c); }
function evKind(c){ if(!c) return ""; if (c.kind==="personal") return evIsAdmin(c)?"Your calendar":`${evFirst(c.host)}'s calendar`; if (c.kind==="city") return "City calendar"; if (c.kind==="user") return evIsAdmin(c)?"You run it":`Run by ${(DB.people[c.admins[0]]||{}).name||"a member"}`; return `${c.famExt || (DB.families.find(f=>f.id===c.family)||{}).name} family`; }
function evWhen(e){ return `${e.when}${e.end?`–${e.end}`:""}`; }
/* who approves an event placed on calendar c by me */
function evApprover(c){ if (!c || evIsAdmin(c)) return null; if (c.kind==="family") return `${c.famExt||(DB.families.find(f=>f.id===c.family)||{}).name} organizers`; if (c.kind==="city") return "Key's team"; return `${evFirst(c.admins[0])}, who runs it`; }

function evCalMark(c){ return c.kind==="personal"&&evIsAdmin(c) ? DB.user.initials : c.kind==="personal" ? (DB.people[c.host]||{initials:c.name[0]}).initials : c.name[0]; }

evThumb = function(e, cls){ const d=evDate(e); return `<div class="${cls} evx-th" style="background:${evBg(e.theme)}"><span class="evx-dd"><b>${d.getDate()}</b>${EV_MON[d.getMonth()]}</span></div>`; };

function evState(e){ if (e.past) return ""; if (evLocked(e)) return "Members only"; return { invited:"Invited", going:"Going", hosting:"Hosting", pending:"Waiting", waitlist:"Waiting" }[e.reg] || ""; }
function evTag(e){ const st=evState(e); return st?`<span class="evx-tag ${{Invited:"inv",Going:"go",Hosting:"host",Waiting:"wait","Members only":"lock"}[st]}">${st}</span>`:""; }
/* Fable round 12's status formula: going count, then how many Kai thinks you should meet. Nothing else. */
evStatus = function(e){
  if (e.past) return e.met&&e.met.length?`You met ${e.met.map(evFirst).join(", ")}`:"You went";
  const meet = e.reg==="hosting"||evLocked(e) ? 0 : (e.meet||[]).length;

};
function evFaces(e){ const ids=(e.meet&&e.meet.length?e.meet:(e.goingList||[])).slice(0,3); return ids.length?`<span class="evx-faces">${ids.map(id=>`<i>${(DB.people[id]||{initials:"?"}).initials}</i>`).join("")}</span>`:""; }
function evPill(c){ return c?`<span class="evx-pill" data-cal="${c.id}"><i style="background:${evBg(c.theme)}">${c.name[0]}</i>${c.name}</span>`:""; }
evCard = function(e, size, opts){

function evByDate(list, empty, here){
  if (!list.length) return `<div class="empty">${empty}</div>`;

/* ---- register, cancel, follow ---- */
rsvp = function(id, on){ const e=evE(id); if (on) { openSheet("evreg", id); return; } e.reg="none"; e.rsvp=false; e.going=Math.max(0,e.going-1); render(); toast("Cancelled. The host sees a status line, nothing else."); };
function evRegister(id){

function evToggleFollow(cid){ const c=evC(cid); if (evIsAdmin(c)) { toast("You run this calendar."); return; } const on=evFollows(c);

    ${block}

    ${meet?`<div class="lbl">Who to meet${e.reg==="going"?"":" if you go"}</div>${meet}`:""}
    ${!locked&&e.details?`<div class="lbl">Details</div><p class="evx-p">${e.details}</p>`:""}
    ${guests}
    ${e.past&&e.met&&e.met.length?`<div class="lbl">From your debrief</div>${e.met.map(x=>{const p=DB.people[x];return `<div class="rowitem" data-profile="${x}">${av(p.initials)}<div class="m"><div class="a">${p.name}</div><div class="b">Talked at ${e.name}. Follow-up sent, replied.</div></div><div class="s">edge</div></div>`}).join("")}`:""}

/* ---- host: create on any calendar. The calendar comes first because it decides who approves. ---- */

function evPublish(){
  const d = evDraft(); const name = (document.getElementById("evname")||{}).value || d.name || "Product teardown: Figma";
  const id = "e" + (100 + DB.fevents.length); const c = evC(d.cal); const appr = evApprover(c);
  DB.fevents.push({ id, name, when:"Fri, Oct 16, 6pm", end:"8pm", day:"Oct 16", where:d.fmt==="online"?"Online":"Mountain View", going:1, rsvp:true, family:c&&c.family||null, host:EV_ME, bucket:"upcoming", cal:c.id, listed:[], pending:[], theme:d.theme, fmt:d.fmt, cap:d.cap, approval:d.approval, vis:d.vis==="public"?"public":(c.kind==="personal"?"invite":"members"), price:d.paid?20:0, sort:1016, reg:"hosting", details:d.desc, meet:[], requests:[], goingList:[], checked:{}, broadcasts:[], awaiting:appr, checkedIn:false, past:false });
  c.events.push(id); if (d.from) DB.fevents.splice(DB.fevents.findIndex(x=>x.id===d.from),1);
  STATE.evDraft = null; STATE.evMtab="guests"; go("eventd:manage."+id);
  toast(appr ? `Sent. ${appr.replace(", who runs it","")} approve${appr.endsWith("s")?"":"s"} it before it goes live.` : `Published on ${c.kind==="personal"?"your calendar":c.name}.`);
}

  else if (t==="broadcast") body = `<div class="lbl">To</div><div class="seg">${[["going","Going"],["all","Going and waiting"]].map(([k,l])=>`<div class="${(STATE.evAud||"going")===k?'on':''}" data-evaud="${k}">${l}</div>`).join("")}</div>

/* ---- calendar page, and calendar admin for the ones you run ---- */
sCalendar = function(id){
  if (id.endsWith(".manage")) return evCalManage(id.slice(0,-7));

  const own = c.kind==="personal" && admin;
  let list = "";
  if (seg==="up") list = evByDate(evs.filter(e=>!e.past), "Nothing scheduled.", c.id);

  const actions = admin

  <div class="body">
    ${evCover({theme:c.theme},"hero cal", `${c.kind==="personal"?`<span class="evx-date">${own?"Your calendar":"Personal calendar"}</span>`:""}<div class="evx-htitle">${c.name}</div>`)}

    <div class="evx-stats"><span><b>${c.subs.toLocaleString()}</b> followers</span>${c.kind==="family"?`<span><b>${(c.members||(DB.families.find(f=>f.id===c.family)||{}).members||0).toLocaleString()}</b> members</span>`:""}<span><b>${evs.filter(e=>!e.past).length}</b> upcoming</span></div>

      : on&&c.auto&&!c.subscribed?`<div class="xs faint" style="margin-top:8px">Following because you're a member. New events and changes, at most two pushes a day.</div>`:on?`<div class="xs faint" style="margin-top:8px">New events and changes, at most two pushes a day.</div>`:""}

function evCalManage(id){

  if (t==="requests") body = req.length ? req.map(r=>`<div class="rowitem" style="cursor:default">${av(DB.people[r.from].initials)}<div class="m"><div class="a">${r.name}</div><div class="b">${DB.people[r.from].name} · ${r.when}</div></div><button class="btn sm sec" data-evcalreq="${id}|${r.id}|no">Decline</button><button class="btn sm" data-evcalreq="${id}|${r.id}|yes">Approve</button></div>`).join("") + `<div class="xs faint" style="margin-top:8px">The host sees Approved or Not listed, never a reason.</div>` : `<div class="empty">Nothing to review.</div>`;

  phone.querySelectorAll("[data-undopass]").forEach(el=>el.onclick=()=>undoPass(el.dataset.undopass));
  phone.querySelectorAll("[data-replyask]").forEach(el=>el.onclick=()=>replyAskSend(el.dataset.replyask));
  cyclePersonaLabel();
  phone.querySelectorAll("[data-push]").forEach(el=>el.onclick=()=>{ const a=STATE.push.actions[+el.dataset.push]; STATE.push=null; a[1](); });
  phone.querySelectorAll("[data-nudge]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openSheet("preview", el.dataset.nudge); });
  phone.querySelectorAll("[data-reply]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openSheet("reply", el.dataset.reply); });
  phone.querySelectorAll("[data-sendreply]").forEach(el=>el.onclick=()=>sendReply(el.dataset.sendreply));
  phone.querySelectorAll("[data-journal]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openSheet("journal", el.dataset.journal); });
  phone.querySelectorAll("[data-outcome]").forEach(el=>el.onclick=()=>{ const [id,v]=el.dataset.outcome.split("|"); logOutcome(id,v); });
  phone.querySelectorAll("[data-metyes]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); const o=DB.opps.find(x=>x.id===el.dataset.metyes); o.met=true; lit(o,"In conversation","Thu"); o.log.push(["You","confirmed the meeting.","Thu"]); render(); toast("Marked as met."); });
  phone.querySelectorAll("[data-close]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openSheet("close", el.dataset.close); });
  phone.querySelectorAll("[data-closefinal]").forEach(el=>el.onclick=()=>{ const [mid,how]=el.dataset.closefinal.split("|"); closeMission(mid,how); });
  phone.querySelectorAll("[data-act-event]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); go("eventd:e1"); });
  phone.querySelectorAll("[data-event]").forEach(el=>el.onclick=(e)=>{ if(e.target.closest("[data-act-event]")) return; go("eventd:e1"); });
  // Kai button: tap = composer, hold = quick voice, hold + slide up = call
  const kb=phone.querySelector("#kaiBtn"); if (kb && kaiHasNudge()) kb.insertAdjacentHTML("beforeend", '<span class="knudge"></span>');
  if (kb) {
    let hint=null, started=false;
    const showHint=()=>{ if(hint) return; hint=document.createElement("div"); hint.className="kaihint"; hint.innerHTML=`<div class="kh-arrow">↑</div><div>Slide up to call</div><div class="xs" style="opacity:.7">Release to send</div>`; phone.appendChild(hint); };
    const killHint=()=>{ if(hint){ hint.remove(); hint=null; } };
    kb.onpointerdown=(e)=>{ kb.setPointerCapture(e.pointerId); holdStart=e.clientY; holdY=e.clientY; holdFired=false; started=false; holdTimer=setTimeout(()=>{ holdFired=true; showHint(); startQuickVoice(); },300); };
    kb.onpointermove=(e)=>{ holdY=e.clientY; const dy=holdStart-holdY; if(hint) hint.style.transform=`translate(-50%, ${-Math.min(dy,40)}px)`; if(!started && dy>70){ started=true; clearTimeout(holdTimer); killHint(); holdFired=false; if(STATE.quick){ clearInterval(STATE.quickTimer); STATE.quick=null; } startCall(); } };
    kb.onpointerup=()=>{ clearTimeout(holdTimer); killHint(); if(started){ started=false; return; } if(!holdFired) { if(STATE.callActive) expandCall(); else openSheet("kai"); } else if(STATE.quick) endQuickVoice(); holdFired=false; };
    kb.onpointercancel=()=>{ clearTimeout(holdTimer); killHint(); holdFired=false; started=false; if(STATE.quick&&STATE.quick.phase==="listen"){ clearInterval(STATE.quickTimer); STATE.quick=null; render(); } };
  }
  // home: mission cards expand in place
  phone.querySelectorAll("[data-mexp]").forEach(el=>el.onclick=(e)=>{ if(e.target.closest("[data-mission]")) return; const id=el.dataset.mexp; STATE.expanded = STATE.expanded===id?null:id; render(); });
  // families
  phone.querySelectorAll("[data-fpill]").forEach(el=>el.onclick=()=>{ const id=el.dataset.fpill; if(id==="roles"){ STATE.back="family"; STATE.searchKind="role"; STATE.searchFam=fam().id; go("explore"); return; } go(id==="chat"?"family":id); });
  phone.querySelectorAll("[data-channel]").forEach(el=>el.onclick=()=>go("channel:"+el.dataset.channel));
  phone.querySelectorAll("[data-cat]").forEach(el=>el.onclick=()=>{ const c=el.dataset.cat; STATE.catOpen[c] = STATE.catOpen[c]===false ? true : false; render(); });
  phone.querySelectorAll("[data-more]").forEach(el=>el.onclick=()=>{ STATE.catOpen["more:"+el.dataset.more]=true; render(); });
  phone.querySelectorAll("[data-join]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); const c=(DB.channels[STATE.family]||[]).find(x=>x.id===el.dataset.join); if(c.private){ toast("Requested. The organizer approves private channels."); } else { c.joined=true; toast(`Joined ${c.name}`); } render(); });
  phone.querySelectorAll("[data-preview]").forEach(el=>el.onclick=(e)=>{ if(e.target.closest("[data-join]")) return; const c=(DB.channels[STATE.family]||[]).find(x=>x.id===el.dataset.preview); toast(`${c.name}: ${c.members} members. Preview before joining (out of scope).`); });
  phone.querySelectorAll("[data-track]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); const [cid,i]=el.dataset.track.split(":"); trackRole(cid, +i); render(); });
  phone.querySelectorAll("[data-pfilter]").forEach(el=>el.onclick=()=>{ STATE.peopleFilter=el.dataset.pfilter; render(); });
  phone.querySelectorAll("[data-fset]").forEach(el=>el.onclick=()=>{ STATE.fsettings[el.dataset.fset]=!STATE.fsettings[el.dataset.fset]; render(); });
  phone.querySelectorAll("[data-manage]").forEach(el=>el.onclick=()=>{ if(el.dataset.manage==="outcomes"){ go("report"); return; } go("manage:"+el.dataset.manage); });
  phone.querySelectorAll("[data-switch]").forEach(el=>el.onclick=()=>{ STATE.family=el.dataset.switch; STATE.sheet=null; go("family"); });
  const ft=phone.querySelector("#famTab");
  if (ft) {
    let t=null, fired=false;
    const famScreens = ["family","people","fevents","posts","manage","fsettings","eventchat"];
    const onFam = famScreens.includes(STATE.screen) || STATE.screen.startsWith("channel:") || STATE.screen.startsWith("manage:");
    ft.onpointerdown=()=>{ fired=false; t=setTimeout(()=>{ fired=true; openSheet("switcher"); },450); };
    ft.onpointerup=()=>{ clearTimeout(t); if(!fired){ if(onFam) openSheet("switcher"); else go("family"); } fired=false; };
    ft.onpointercancel=()=>clearTimeout(t);
  }
  const ot=document.getElementById("orgToggle"); if(ot){ ot.textContent = "Organizer"; ot.classList.toggle("on", !!STATE.asOrganizer); }
  const nb=document.getElementById("netBtn"); if(nb){ nb.textContent = STATE.offline ? "Network: off" : "Network: on"; nb.classList.toggle("on", !!STATE.offline); }
  // Any sheet: drag down anywhere (when content is at the top) to dismiss, drag up on the handle to expand
  const grab=phone.querySelector("#grab"), sheetEl=phone.querySelector("#sheet");
  if (sheetEl && !phone.querySelector("[data-pull]")) {
    const sb=sheetEl.querySelector(".sb");
    let y0=null, dy=0, t0=0, active=false, fromHandle=false;
    const start=(y,handle)=>{ y0=y; dy=0; t0=Date.now(); active=false; fromHandle=handle; };
    const move=(y,ev)=>{ if(y0===null) return; dy=y-y0; const atTop = fromHandle || !sb || sb.scrollTop<=0;
      if(!active && Math.abs(dy)>8 && ((dy>0&&atTop)||(dy<0&&fromHandle))) { active=true; sheetEl.classList.add("dragging"); }
      if(active){ if(ev&&ev.cancelable) ev.preventDefault(); if(dy>0) sheetEl.style.transform=`translateY(${dy}px)`; } };
    const end=()=>{ if(y0===null) return; const v = dy/Math.max(1,Date.now()-t0); sheetEl.classList.remove("dragging"); sheetEl.style.transform="";
      if(active && (dy>110 || (dy>40 && v>0.5))) { if (STATE.sheetFull && dy<160) { STATE.sheetFull=false; render(); } else closeSheet(); } else if(active && fromHandle && dy<-50){ STATE.sheetFull=true; render(); }
      y0=null; active=false; };
    sheetEl.addEventListener("touchstart",(e)=>start(e.touches[0].clientY, !!e.target.closest("#grab")),{passive:true});
    sheetEl.addEventListener("touchmove",(e)=>move(e.touches[0].clientY,e),{passive:false});
    sheetEl.addEventListener("touchend",end); sheetEl.addEventListener("touchcancel",end);
    sheetEl.addEventListener("mousedown",(e)=>{ if(e.target.closest("input,textarea,button")) return; start(e.clientY, !!e.target.closest("#grab")); const mm=(ev)=>move(ev.clientY,ev); const mu=()=>{ end(); window.removeEventListener("mousemove",mm); window.removeEventListener("mouseup",mu); }; window.addEventListener("mousemove",mm); window.addEventListener("mouseup",mu); });
  }
  // Kai sheet: the pull handle enters call mode on a strong swipe, dismisses on a drag down
  const pull0=phone.querySelector("[data-pull]");
  if (pull0 && sheetEl) {
    const sb=sheetEl.querySelector(".sb"); let y1=null, d1=0, act=false, fromPull=false;
    const st=(y,p)=>{ y1=y; d1=0; act=false; fromPull=p; };
    const mv=(y,ev)=>{ if(y1===null) return; d1=y-y1; const atTop=fromPull||!sb||sb.scrollTop<=0; if(!act&&Math.abs(d1)>8&&((d1>0&&atTop)||(d1<0&&fromPull))) act=true; if(act){ if(ev&&ev.cancelable) ev.preventDefault(); if(d1>0) sheetEl.style.transform=`translateY(${d1}px)`; if(fromPull&&d1<-70){ y1=null; sheetEl.style.transform=""; startCall(); } } };
    const en=()=>{ if(y1===null) return; sheetEl.style.transform=""; if(act&&d1>110) closeSheet(); y1=null; act=false; };
    sheetEl.addEventListener("touchstart",(e)=>st(e.touches[0].clientY, !!e.target.closest("[data-pull]")),{passive:true});
    sheetEl.addEventListener("touchmove",(e)=>mv(e.touches[0].clientY,e),{passive:false});
    sheetEl.addEventListener("touchend",en); sheetEl.addEventListener("touchcancel",en);
    sheetEl.addEventListener("mousedown",(e)=>{ if(e.target.closest("input,textarea,button")) return; st(e.clientY, !!e.target.closest("[data-pull]")); const mm=(ev)=>mv(ev.clientY,ev); const mu=()=>{ en(); window.removeEventListener("mousemove",mm); window.removeEventListener("mouseup",mu); }; window.addEventListener("mousemove",mm); window.addEventListener("mouseup",mu); });
  }
  // Kai sheet: swipe up on the handle to enter call mode

  // Full-screen call: swipe up on the top handle, or tap Minimize, to keep the call in a bar while browsing
  const mhd=phone.querySelector("[data-minhandle]");
  if (mhd) { let y0=null; mhd.onpointerdown=(e)=>{ if(e.target.closest("[data-minimize]")) return; y0=e.clientY; mhd.setPointerCapture(e.pointerId); }; mhd.onpointermove=(e)=>{ if(y0!==null && y0-e.clientY>60){ y0=null; minimizeCall(); } }; mhd.onpointerup=()=>{ y0=null; }; }
  phone.querySelectorAll("[data-minimize]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); minimizeCall(); });
  phone.querySelectorAll("[data-expand]").forEach(el=>el.onclick=(e)=>{ if(e.target.closest("[data-cmute],[data-cend]")) return; expandCall(); });
  phone.querySelectorAll("[data-cmute]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); STATE.callMuted=!STATE.callMuted; render(); });
  phone.querySelectorAll("[data-cend]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); endCall(); });
  // Kai sheet composer: hold mic shows a live transcript, release sends it
  const km=phone.querySelector("#kaiMic");
  if (km) { let t=null, words=["Add","a","constraint:","only","companies","under","200","people"], i=0, iv=null;
    km.onpointerdown=(e)=>{ km.setPointerCapture(e.pointerId); STATE.listening=true; render(); i=0; iv=setInterval(()=>{ const el=phone.querySelector("#liveTx"); if(el && i<words.length){ el.textContent+= (i?" ":"")+words[i++]; } },220); };
    km.onpointerup=()=>{ clearInterval(iv); if(STATE.quick&&STATE.quick.phase==="listen") endQuickVoice(); STATE.kaiMsgs=STATE.kaiMsgs||[]; STATE.kaiMsgs.push({who:"u",text:"(Spoken) Add a constraint: only companies under 200 people"}); const m=DB.missions.find(x=>x.type==="Looking")||DB.missions[0]; if(m&&!m.constraints.includes("Under 200 people")) m.constraints.push("Under 200 people"); STATE.kaiMsgs.push({who:"k",text:"Added \"under 200 people\" to your Senior PM role mission. Anthropic is bigger than that, so Rahul moved to candidates. Next search Friday uses it.",chips:null}); STATE.kaiMsgs.push({who:"sys",text:"Brief updated in Senior PM role at an AI company"}); render(); };
    km.onpointercancel=()=>{ clearInterval(iv); if(STATE.quick&&STATE.quick.phase==="listen") endQuickVoice(); render(); }; }
  const ks=phone.querySelector("#kaiSend"); if(ks) ks.onclick=()=>{ const ta=phone.querySelector("#kaiInput"); if(!ta||!ta.value.trim()) return; STATE.kaiMsgs=STATE.kaiMsgs||[]; STATE.kaiMsgs.push({who:"u",text:ta.value.trim()}); STATE.kaiMsgs.push({who:"k",text:"In the product this routes to the right mission or answers with receipts. In this proof of concept, the suggested prompts are the scripted ones."}); render(); };
  const tr=phone.querySelector("#tr"); if(tr) tr.scrollTop=tr.scrollHeight;
}
render();
</script>
</body>
</html>
